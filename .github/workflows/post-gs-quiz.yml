name: 📮 Post 30 Random GS Quiz Questions

on:
  schedule:
    - cron: '37 11,18 * * *'  # Same 2-hour cadence as the original
  push:
    paths:
      - 'GS_Quiz.docx'
      - '.github/workflows/post-gs-quiz.yml'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Random seed for reproducibility (optional)'
        required: false
        default: ''

jobs:
  post-gs-quiz:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies
        run: |
          pip install python-telegram-bot httpx python-docx

      - name: 📄 Check if quiz file exists
        id: check_file
        run: |
          if [ -f "GS_Quiz.docx" ]; then
            echo "file_exists=true" >> $GITHUB_OUTPUT
          else
            echo "file_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Post random GS quiz questions to Telegram
        if: steps.check_file.outputs.file_exists == 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_GS_CHAT_ID }}
          RANDOM_SEED: ${{ github.event.inputs.seed || '' }}
        run: |
          python - << 'PYTHON_EOF'
          import os
          import sys
          import asyncio
          sys.path.insert(0, '.')
          from telegram_native_scheduler import TelegramNativeScheduler

          async def main():
              bot_token = os.getenv('BOT_TOKEN')
              chat_id = int(os.getenv('CHAT_ID'))
              seed_str = os.getenv('RANDOM_SEED', '')

              if not bot_token or not chat_id:
                  print("❌ Error: BOT_TOKEN or CHAT_ID not set!")
                  sys.exit(1)

              random_seed = None
              if seed_str and seed_str.strip():
                  try:
                      random_seed = int(seed_str)
                  except ValueError:
                      pass

              scheduler = TelegramNativeScheduler(bot_token)

              quizzes = await scheduler.extract_quizzes_from_docx('GS_Quiz.docx')
              if not quizzes:
                  print("❌ No valid quizzes found!")
                  sys.exit(1)

              print(f"📊 Total questions available: {len(quizzes)}")
              print(f"🎲 Selecting 30 random questions...")

              # No quotes for this channel — quotes=[] means the quote step
              # inside post_session is skipped automatically.
              await scheduler.post_session(
                  quizzes=quizzes,
                  quotes=[],
                  chat_ids=[chat_id],
                  quote_chat_ids=[chat_id],
                  num_questions=30,
                  random_seed=random_seed
              )

          asyncio.run(main())
          PYTHON_EOF

      - name: ✅ Success
        if: success()
        run: echo "🎉 GS Quiz questions posted successfully!"

      - name: ❌ Failed
        if: failure()
        run: echo "⚠️ Failed to post. Check logs above."
